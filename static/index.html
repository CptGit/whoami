<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我是谁 - 游戏大厅</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between p-3 sm:p-4">
    <div class="max-w-md w-full mx-auto bg-white p-4 sm:p-6 rounded-2xl shadow-lg my-auto">
        <!-- 登录界面 -->
        <div id="login-screen">
            <h1 class="text-2xl font-bold mb-4 text-center text-gray-800">我是谁</h1>
            <div class="space-y-3">
                <input id="room-id" class="w-full border border-gray-300 p-3 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="请输入房间号 (如 888)">
                <input id="user-name" class="w-full border border-gray-300 p-3 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="请输入你的名字">
                <button onclick="connect()" class="w-full bg-blue-500 hover:bg-blue-600 text-white p-3 rounded-xl font-bold text-base transition shadow-md">进入房间</button>
            </div>
        </div>

        <!-- 游戏界面 -->
        <div id="game-screen" class="hidden space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 id="room-title" class="font-bold text-lg text-blue-600"></h2>
                <span id="player-count" class="text-xs bg-gray-100 text-gray-600 px-2.5 py-1 rounded-full font-medium"></span>
            </div>
            
            <!-- 我的专属角色卡片 -->
            <div id="target-card" class="bg-yellow-50 border border-yellow-300 p-3 rounded-xl text-center shadow-sm hidden">
                <p class="text-xs text-gray-500 mb-0.5">你的身份分配：</p>
                <span id="target-name" class="font-bold text-2xl text-yellow-800">???</span>
                <p class="text-xs text-gray-400 mt-0.5">（所有人都能看到，只有你看不到）</p>
            </div>

            <!-- 玩家看板 -->
            <div class="bg-gray-50 border rounded-xl p-3">
                <h3 class="font-bold text-xs text-gray-500 mb-2 uppercase tracking-wider">房间玩家</h3>
                <div id="players-list" class="grid grid-cols-2 gap-2 text-sm"></div>
            </div>

            <!-- 准备区 -->
            <div id="pre-game-actions" class="space-y-3">
                <button onclick="toggleReady()" id="ready-btn" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white p-3 rounded-xl font-bold text-base transition shadow-md">点击准备 🟢</button>
                <button onclick="startGame()" id="start-btn" class="w-full bg-green-500 hover:bg-green-600 text-white p-3 rounded-xl font-bold text-base transition shadow-md opacity-50 cursor-not-allowed" disabled>开始游戏 (需全员准备)</button>
            </div>

            <!-- 游戏主交互区 -->
            <div id="in-game-actions" class="space-y-3 hidden">
                
                <!-- 当前提问/回答/猜测 核心区域 -->
                <div id="active-question-panel" class="bg-blue-50 border-2 border-blue-400 p-3.5 rounded-xl space-y-2 shadow-sm hidden">
                    <div class="flex justify-between items-center border-b border-blue-200 pb-1.5">
                        <span id="aq-asker" class="font-bold text-blue-900 text-sm"></span>
                        <span id="aq-status" class="text-xs bg-blue-200 text-blue-800 px-2 py-0.5 rounded font-medium"></span>
                    </div>
                    <div id="aq-text" class="text-gray-900 font-bold text-base bg-white p-2.5 rounded-lg border border-blue-100"></div>
                    
                    <!-- 回答进度情况 -->
                    <div class="space-y-1 pt-1">
                        <p class="text-xs text-gray-500 font-semibold">各玩家回答进度：</p>
                        <div id="aq-answers-list" class="grid grid-cols-2 gap-1.5 text-xs"></div>
                    </div>

                    <!-- 回答操作按钮 -->
                    <div id="answer-action-area" class="pt-2 border-t border-blue-200 hidden">
                        <p id="answer-tip" class="text-xs font-bold mb-1.5 text-indigo-700">请对该提问做出回答：</p>
                        <div class="flex gap-2">
                            <button onclick="answerQuestion('是')" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white p-2.5 rounded-xl font-bold text-sm shadow">👍 是</button>
                            <button onclick="answerQuestion('否')" class="flex-1 bg-rose-500 hover:bg-rose-600 text-white p-2.5 rounded-xl font-bold text-sm shadow">👎 否</button>
                        </div>
                    </div>

                    <!-- 猜测操作按钮 -->
                    <div id="guess-action-area" class="pt-2 border-t border-purple-200 hidden space-y-2">
                        <p class="text-xs text-purple-700 font-bold">所有回答完毕，请输入猜测或直接跳过：</p>
                        <div class="flex gap-2">
                            <input id="guess-input" class="flex-1 border border-purple-300 p-2 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="输入猜测的名字...">
                            <button onclick="submitGuess()" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded-lg font-bold text-sm shadow">提交猜测</button>
                            <button onclick="skipGuess()" class="bg-gray-400 hover:bg-gray-500 text-white px-3 py-2 rounded-lg font-bold text-sm shadow">跳过</button>
                        </div>
                    </div>
                </div>

                <!-- 发起提问区域 -->
                <div id="ask-action-area" class="space-y-1.5 hidden">
                    <p id="ask-tip" class="text-xs font-bold text-gray-500"></p>
                    <div class="flex gap-2">
                        <input id="question" class="flex-1 border-2 border-blue-400 p-3 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="如: 我是古代人吗？">
                        <button onclick="askQuestion()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-xl font-bold text-base transition shadow-md">发起提问</button>
                    </div>
                </div>

                <!-- 轮到他人提问 / 状态提示框 -->
                <div id="waiting-turn-tip" class="text-center p-3 bg-gray-50 rounded-xl border text-gray-600 text-sm hidden"></div>

                <!-- 我的历史提问与回答复盘面板 -->
                <div id="my-history-container" class="bg-purple-50 border-2 border-purple-300 rounded-xl p-3.5 space-y-2 shadow-sm">
                    <div class="flex justify-between items-center border-b border-purple-200 pb-1">
                        <h3 class="font-bold text-sm text-purple-900 flex items-center gap-1">
                            📋 我的历史提问与回答线索
                        </h3>
                        <span class="text-xs text-purple-600 font-medium">帮助推理身份</span>
                    </div>
                    <div id="my-history-list" class="space-y-2 max-h-48 overflow-y-auto text-xs"></div>
                </div>

            </div>

            <!-- 游戏日志 -->
            <div class="border-t pt-3">
                <h3 class="font-bold text-xs text-gray-500 mb-1.5 uppercase tracking-wider">实时动态</h3>
                <div id="events" class="space-y-1 max-h-28 overflow-y-auto bg-gray-50 p-2.5 rounded-xl border text-xs"></div>
            </div>
        </div>
    </div>

    <script>
        let ws;
        let isReady = false;

        function connect() {
            const room = document.getElementById('room-id').value.trim();
            const name = document.getElementById('user-name').value.trim();
            if (!room || !name) return alert('请完整填写房间号和名字！');
            
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/${room}/${encodeURIComponent(name)}`);
            
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                
                if (data.type === 'ERROR') {
                    alert(data.message);
                    location.reload();
                    return;
                }

                if (data.type === 'ROOM_STATE') {
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('game-screen').classList.remove('hidden');
                    document.getElementById('room-title').innerText = `房间号: ${room}`;
                    document.getElementById('player-count').innerText = `在线: ${data.players.length}人`;
                    
                    const myId = data.players.find(x => x.isMe)?.id;

                    // 1. 渲染玩家列表
                    const playersListDiv = document.getElementById('players-list');
                    playersListDiv.innerHTML = data.players.map((p, idx) => {
                        let statusBadge = '';
                        if (p.finished) {
                            statusBadge = `<span class="text-xs text-purple-600 font-bold">🏆 已通关</span>`;
                        } else if (data.started && idx === data.turn_index) {
                            statusBadge = `<span class="text-xs text-blue-600 font-bold animate-pulse">👉 提问中</span>`;
                        } else if (!data.started) {
                            statusBadge = `<span class="text-xs font-bold ${p.ready ? 'text-green-600' : 'text-gray-400'}">${p.ready ? '已准备' : '未准备'}</span>`;
                        } else {
                            statusBadge = `<span class="text-xs text-gray-400">等待中</span>`;
                        }

                        return `
                            <div class="bg-white p-2.5 rounded-lg border shadow-xs flex flex-col justify-between">
                                <div class="flex justify-between items-center">
                                    <span class="font-semibold text-gray-800 truncate">${p.name} ${p.isMe ? '<span class="text-xs text-blue-500 font-normal">(我)</span>' : ''}</span>
                                    ${statusBadge}
                                </div>
                                ${data.started ? `<span class="text-xs text-indigo-600 font-bold mt-1">🏷️ ${p.targetPerson}</span>` : ''}
                            </div>
                        `;
                    }).join('');

                    // 2. 准备状态
                    const me = data.players.find(x => x.isMe);
                    if (me) {
                        isReady = me.ready;
                        const readyBtn = document.getElementById('ready-btn');
                        if (isReady) {
                            readyBtn.innerText = "取消准备 ⚪";
                            readyBtn.className = "w-full bg-gray-400 hover:bg-gray-500 text-white p-3 rounded-xl font-bold text-base transition shadow-md";
                        } else {
                            readyBtn.innerText = "点击准备 🟢";
                            readyBtn.className = "w-full bg-yellow-500 hover:bg-yellow-600 text-white p-3 rounded-xl font-bold text-base transition shadow-md";
                        }
                    }

                    // 3. 游戏UI展现与控制
                    const preGameActions = document.getElementById('pre-game-actions');
                    const inGameActions = document.getElementById('in-game-actions');
                    const targetCard = document.getElementById('target-card');
                    const startBtn = document.getElementById('start-btn');

                    if (data.started) {
                        preGameActions.classList.add('hidden');
                        inGameActions.classList.remove('hidden');
                        targetCard.classList.remove('hidden');

                        if (me && me.targetPerson) {
                            document.getElementById('target-name').innerText = me.targetPerson;
                        }

                        // 我的历史提问与回答线索
                        const myHistoryList = document.getElementById('my-history-list');
                        const myPastQuestions = (data.question_history || []).filter(q => q.asker_id === myId);
                        if (myPastQuestions.length === 0) {
                            myHistoryList.innerHTML = `<p class="text-gray-400 italic py-1">你还没有提问过。轮到你提问时，大家的回答会集中显示在这里。</p>`;
                        } else {
                            myHistoryList.innerHTML = myPastQuestions.map((q, i) => {
                                const answersHtml = Object.entries(q.answers).map(([pid, ans]) => {
                                    const pObj = data.players.find(x => x.id === pid);
                                    const pName = pObj ? pObj.name : '某玩家';
                                    return `<span class="bg-white px-2 py-0.5 rounded border border-purple-200 text-gray-700">${pName}: <b class="${ans === '是' ? 'text-emerald-600' : 'text-rose-600'}">${ans}</b></span>`;
                                }).join(' ');

                                return `
                                    <div class="bg-white p-2.5 rounded-lg border border-purple-200 space-y-1 shadow-xs">
                                        <div class="font-bold text-purple-900">问: ${q.text}</div>
                                        <div class="flex flex-wrap gap-1.5 pt-1">${answersHtml || '<span class="text-gray-400">无回答</span>'}</div>
                                    </div>
                                `;
                            }).join('');
                        }

                        // 问答交互状态分配
                        const activeQPanel = document.getElementById('active-question-panel');
                        const askActionArea = document.getElementById('ask-action-area');
                        const answerActionArea = document.getElementById('answer-action-area');
                        const guessActionArea = document.getElementById('guess-action-area');
                        const waitingTurnTip = document.getElementById('waiting-turn-tip');
                        const answerTip = document.getElementById('answer-tip');
                        const askTip = document.getElementById('ask-tip');

                        const currentTurnPlayer = data.players[data.turn_index];
                        const isMyTurn = currentTurnPlayer && currentTurnPlayer.id === myId;
                        const q = data.current_question;

                        if (q) {
                            activeQPanel.classList.remove('hidden');
                            document.getElementById('aq-asker').innerText = `❓ 【${q.asker_name}】 提问`;
                            document.getElementById('aq-text').innerText = q.text;
                            
                            const isAsker = q.asker_id === myId;

                            if (q.stage === 'answering') {
                                document.getElementById('aq-status').innerText = '正在等待回答...';
                                guessActionArea.classList.add('hidden');

                                const answersList = document.getElementById('aq-answers-list');
                                answersList.innerHTML = data.players
                                    .filter(p => p.id !== q.asker_id)
                                    .map(p => {
                                        const ans = q.answers[p.id];
                                        return `<div class="bg-white p-1.5 rounded border flex justify-between items-center">
                                            <span class="text-gray-700">${p.name}${p.finished ? ' (已通关)' : ''}</span>
                                            <span class="font-bold ${ans ? 'text-green-600' : 'text-gray-400'}">${ans ? '已回答: ' + ans : '未回答'}</span>
                                        </div>`;
                                    }).join('');

                                if (!isAsker && !q.answers[myId]) {
                                    answerActionArea.classList.remove('hidden');
                                    if (me.finished) {
                                        answerTip.innerText = "🏆 你已通关！请协助回答【" + q.asker_name + "】的问题：";
                                    } else {
                                        answerTip.innerText = "请对【" + q.asker_name + "】的提问做出回答：";
                                    }
                                } else {
                                    answerActionArea.classList.add('hidden');
                                }
                            } else if (q.stage === 'guessing') {
                                document.getElementById('aq-status').innerText = '等待提问者猜测';
                                answerActionArea.classList.add('hidden');

                                const answersList = document.getElementById('aq-answers-list');
                                answersList.innerHTML = data.players
                                    .filter(p => p.id !== q.asker_id)
                                    .map(p => {
                                        const ans = q.answers[p.id] || '无';
                                        return `<div class="bg-white p-1.5 rounded border flex justify-between items-center">
                                            <span class="text-gray-700">${p.name}</span>
                                            <span class="font-bold text-green-600">${ans}</span>
                                        </div>`;
                                    }).join('');

                                if (isAsker) {
                                    guessActionArea.classList.remove('hidden');
                                } else {
                                    guessActionArea.classList.add('hidden');
                                }
                            }

                            askActionArea.classList.add('hidden');
                            waitingTurnTip.classList.add('hidden');

                        } else {
                            activeQPanel.classList.add('hidden');
                            answerActionArea.classList.add('hidden');
                            guessActionArea.classList.add('hidden');

                            if (me.finished) {
                                askActionArea.classList.add('hidden');
                                waitingTurnTip.classList.remove('hidden');
                                waitingTurnTip.innerText = "🎉 你已通关！等待其他玩家进行提问（别人提问时你仍需回答）。";
                            } else if (isMyTurn) {
                                askActionArea.classList.remove('hidden');
                                waitingTurnTip.classList.add('hidden');
                                
                                if (me.last_guess_wrong) {
                                    askTip.innerText = "💡 上一轮猜测不正确（不影响继续游戏），发起新提问收集线索吧：";
                                    askTip.className = "text-xs font-bold text-amber-600 mb-1";
                                } else {
                                    askTip.innerText = "轮到你提问了：";
                                    askTip.className = "text-xs font-bold text-gray-500 mb-1";
                                }
                            } else {
                                askActionArea.classList.add('hidden');
                                waitingTurnTip.classList.remove('hidden');
                                
                                if (me.last_guess_wrong) {
                                    waitingTurnTip.innerText = `❌ 上轮猜测错误，本轮提问结束（不会淘汰）！⏳ 正在等待【${currentTurnPlayer ? currentTurnPlayer.name : ''}】提问...`;
                                } else {
                                    waitingTurnTip.innerText = `⏳ 正在等待【${currentTurnPlayer ? currentTurnPlayer.name : ''}】提问...`;
                                }
                            }
                        }

                    } else {
                        preGameActions.classList.remove('hidden');
                        inGameActions.classList.add('hidden');
                        targetCard.classList.add('hidden');

                        const allReady = data.players.length > 0 && data.players.every(p => p.ready);
                        if (allReady) {
                            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                            startBtn.removeAttribute('disabled');
                        } else {
                            startBtn.classList.add('opacity-50', 'cursor-not-allowed');
                            startBtn.setAttribute('disabled', 'true');
                        }
                    }

                    // 4. 渲染日志
                    const eventsDiv = document.getElementById('events');
                    eventsDiv.innerHTML = data.events.map(ev => 
                        `<div class="py-0.5 border-b border-gray-100 text-gray-700">${ev.content}</div>`).join('');
                    eventsDiv.scrollTop = eventsDiv.scrollHeight;
                }
            };
        }

        function toggleReady() { ws.send(JSON.stringify({action: 'TOGGLE_READY'})); }
        function startGame() { ws.send(JSON.stringify({action: 'START_GAME'})); }
        function askQuestion() {
            const input = document.getElementById('question');
            const text = input.value.trim();
            if (!text) return;
            ws.send(JSON.stringify({action: 'ASK_QUESTION', text: text}));
            input.value = '';
        }
        function answerQuestion(ans) { ws.send(JSON.stringify({action: 'ANSWER_QUESTION', answer: ans})); }
        function submitGuess() {
            const input = document.getElementById('guess-input');
            const guess = input.value.trim();
            if (!guess) return alert('请输入猜测！');
            ws.send(JSON.stringify({action: 'MAKE_GUESS', guess: guess}));
            input.value = '';
        }
        function skipGuess() { ws.send(JSON.stringify({action: 'MAKE_GUESS', guess: ''})); }
    </script>
</body>
</html>
